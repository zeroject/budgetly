name: Release

# Run from the Actions tab. Builds + pushes the image first, then bumps the versions,
# commits, tags and publishes a GitHub release, so the image always exists before
# umbrelOS sees the new version in the store.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: Release notes shown in Umbrel (optional)
        type: string
        default: ""

permissions:
  contents: write
  packages: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute next version
        id: v
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version >/dev/null
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zeroject/budgetly:${{ steps.v.outputs.version }}
            ghcr.io/zeroject/budgetly:latest

      - name: Update Umbrel manifest
        env:
          VERSION: ${{ steps.v.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          node -e '
            const fs = require("fs");
            const dir = "zeroject-budgetly/";
            const { VERSION, NOTES } = process.env;
            let app = fs.readFileSync(dir + "umbrel-app.yml", "utf8");
            app = app.replace(/^version: .*$/m, `version: "${VERSION}"`);
            app = app.replace(/^releaseNotes: .*$/m, `releaseNotes: ${JSON.stringify(NOTES)}`);
            fs.writeFileSync(dir + "umbrel-app.yml", app);
            let dc = fs.readFileSync(dir + "docker-compose.yml", "utf8");
            dc = dc.replace(/ghcr\.io\/zeroject\/budgetly:\S+/, `ghcr.io/zeroject/budgetly:${VERSION}`);
            fs.writeFileSync(dir + "docker-compose.yml", dc);
          '

      - name: Commit, tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json zeroject-budgetly
          git commit -m "Release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main --follow-tags
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
